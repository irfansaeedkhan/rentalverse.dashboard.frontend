apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-apex-io-deployment
  namespace: centher-io-nsp
spec:
  replicas: 1
  selector:
    matchLabels:
      serviceName: app-apex-io-service-name
  template:
    metadata:
      labels:
        serviceName: app-apex-io-service-name
    spec:
      containers:
        - name: app-apex-io-container
          image: { IMAGE_TAG }
          ports:
            - containerPort: 3000
      imagePullSecrets:
        - name: playground-app-apex-io-pull-secret
